name: VPN SSH operation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polimi-vpn-ssh
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check runner capabilities
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          sudo -n true
          test -c /dev/net/tun
          ls -l /dev/net/tun

      - name: Install GlobalProtect client
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            software-properties-common \
            netcat-openbsd \
            openssh-client

          sudo add-apt-repository \
            --yes \
            ppa:yuezk/globalprotect-openconnect

          sudo apt-get update
          sudo apt-get install -y globalprotect-openconnect

          command -v gpclient
          command -v gpauth
          gpclient --version

      - name: Install Python and browser dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install \
            --disable-pip-version-check \
            -r ci/vpn-requirements.txt

          python -m playwright install --with-deps chromium

      - name: Authenticate, connect VPN, and run SSH
        shell: bash
        env:
          GP_PORTAL: ${{ vars.GP_PORTAL }}

          POLIMI_USER: ${{ secrets.POLIMI_USER }}
          POLIMI_PASSWORD: ${{ secrets.POLIMI_PASSWORD }}
          POLIMI_TOTP_SEED: ${{ secrets.POLIMI_TOTP_SEED }}

          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash scripts/run_over_vpn.sh

      - name: Emergency VPN cleanup
        if: always()
        shell: bash
        run: |
          if command -v gpclient >/dev/null 2>&1; then
            sudo -n gpclient disconnect || true
          fi