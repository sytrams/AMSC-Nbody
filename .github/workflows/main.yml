name: VPN SSH operation

on:
  push:
    branches: main

permissions:
  contents: read

concurrency:
  group: polimi-vpn-ssh
  cancel-in-progress: false

jobs:
  connect:
    # Recommended:
    runs-on: [self-hosted, linux, polimi-vpn]

    # Protect this environment with allowed branches and reviewers.
    #environment: polimi-vpn
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install browser dependencies
        run: |
          python -m pip install --require-hashes \
            -r ci/vpn-requirements.txt
          python -m playwright install chromium

      - name: Authenticate, connect VPN, and run SSH
        shell: bash
        env:
          GP_PORTAL: ${{ vars.GP_PORTAL }}

          POLIMI_USER: ${{ secrets.POLIMI_USER }}
          POLIMI_PASSWORD: ${{ secrets.POLIMI_PASSWORD }}
          POLIMI_TOTP_SEED: ${{ secrets.POLIMI_TOTP_SEED }}

          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: scripts/run_over_vpn.sh

      - name: Emergency VPN cleanup
        if: always()
        run: sudo -n gpclient disconnect || true