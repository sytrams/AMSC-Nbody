name: VPN SSH operation

on:
  push:
    branches:
      - main
      - codex/automation-test

jobs:
  connect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check runner capabilities
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          sudo -n true
          test -c /dev/net/tun
          ls -l /dev/net/tun

      - name: Install GlobalProtect client
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            software-properties-common \
            netcat-openbsd \
            openssh-client

          sudo add-apt-repository \
            --yes \
            ppa:yuezk/globalprotect-openconnect

          sudo apt-get update
          sudo apt-get install -y globalprotect-openconnect

          command -v gpclient
          command -v gpauth
          gpclient --version

      - name: Configure CINECA SSH credential
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_CERTIFICATE: ${{ secrets.SSH_CERTIFICATE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cineca
          printf '%s\n' "$SSH_CERTIFICATE" > ~/.ssh/cineca-cert.pub
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cineca ~/.ssh/known_hosts
          chmod 644 ~/.ssh/cineca-cert.pub

      - name: Install Python and browser dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install -r requirements.txt

          python -m playwright install --with-deps chromium

      - name: Authenticate, connect VPN, and verify SSH
        shell: bash
        env:
          POLIMI_USERNAME: ${{secrets.POLIMI_USER}}
          SSH_USERNAME: ${{secrets.SSH_USER}}
          CLUSTER_IP_ADDRESS: ${{secrets.CLUSTER_IP_ADDRESS}}
          POLIMI_PASSWORD: ${{secrets.POLIMI_PASSWORD}}
          POLIMI_TOTP: ${{secrets.POLIMI_TOTP}}
          POLIMI_VPN: ${{secrets.POLIMI_VPN}}
          PYTHONUNBUFFERED: "1"
        run: |
          timeout --signal=INT --kill-after=15s 6m \
            python3 vpn_remote_auth.py

      - name: Emergency VPN cleanup
        if: always()
        shell: bash
        run: |
          if command -v gpclient >/dev/null 2>&1; then
            sudo -n gpclient disconnect || true
          fi
