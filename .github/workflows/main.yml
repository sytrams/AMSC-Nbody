name: NVIDIA cluster GoogleTests

on:
  push:
    branches:
      - main
      - codex/automation-test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cluster-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check runner capabilities
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          sudo -n true
          test -c /dev/net/tun
          ls -l /dev/net/tun

      - name: Install GlobalProtect client
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          APT_OPTIONS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Dpkg::Lock::Timeout=30
            -o Dpkg::Use-Pty=0
          )

          timeout --signal=INT --kill-after=10s 4m \
            sudo apt-get "${APT_OPTIONS[@]}" update
          timeout --signal=INT --kill-after=10s 4m \
            sudo apt-get "${APT_OPTIONS[@]}" install -y \
              software-properties-common \
              netcat-openbsd \
              openssh-client

          timeout --signal=INT --kill-after=10s 90s \
            sudo add-apt-repository \
              --yes \
              ppa:yuezk/globalprotect-openconnect

          timeout --signal=INT --kill-after=10s 4m \
            sudo apt-get "${APT_OPTIONS[@]}" update
          timeout --signal=INT --kill-after=10s 4m \
            sudo apt-get "${APT_OPTIONS[@]}" install -y \
              globalprotect-openconnect

          command -v gpclient
          command -v gpauth
          gpclient --version

      - name: Install Apptainer builder
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          sudo add-apt-repository --yes ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install --yes apptainer

          apptainer version

      - name: Build NVIDIA test container
        id: container
        timeout-minutes: 30
        shell: bash
        run: |
          set -euxo pipefail

          image_path="$RUNNER_TEMP/nbody-tests.sif"
          cache_path="$RUNNER_TEMP/apptainer-cache"
          temporary_path="$RUNNER_TEMP/apptainer-tmp"
          mkdir -p "$cache_path" "$temporary_path"

          sudo env \
            APPTAINER_CACHEDIR="$cache_path" \
            APPTAINER_TMPDIR="$temporary_path" \
            apptainer build \
              --force \
              "$image_path" \
              containers/nbody-tests.def
          sudo chown "$(id -u):$(id -g)" "$image_path"

          test -s "$image_path"
          apptainer inspect "$image_path"
          echo "image=$image_path" >> "$GITHUB_OUTPUT"
          echo "image_bytes=$(stat --format=%s "$image_path")" >> "$GITHUB_OUTPUT"

      - name: Package tracked source
        id: bundle
        shell: bash
        run: |
          set -euxo pipefail

          archive_path="$RUNNER_TEMP/amsc-nbody-${GITHUB_SHA}.tar.gz"
          git archive \
            --format=tar.gz \
            --output="$archive_path" \
            "$GITHUB_SHA"

          test -s "$archive_path"
          echo "archive=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Configure cluster SSH credential
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_CERTIFICATE: ${{ secrets.SSH_CERTIFICATE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cluster
          printf '%s\n' "$SSH_CERTIFICATE" > ~/.ssh/cluster-cert.pub
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cluster ~/.ssh/known_hosts
          chmod 644 ~/.ssh/cluster-cert.pub

      - name: Install Python and browser dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Authenticate and keep VPN connected
        id: vpn
        shell: bash
        env:
          POLIMI_USERNAME: ${{ secrets.POLIMI_USER }}
          POLIMI_PASSWORD: ${{ secrets.POLIMI_PASSWORD }}
          POLIMI_TOTP: ${{ secrets.POLIMI_TOTP }}
          POLIMI_VPN: ${{ secrets.POLIMI_VPN }}
          VPN_READY_FILE: ${{ runner.temp }}/vpn-ready
          VPN_FAILED_FILE: ${{ runner.temp }}/vpn-failed
          VPN_DIAGNOSTICS_DIR: ${{ runner.temp }}/vpn-auth-diagnostics
          VPN_PID_FILE: ${{ runner.temp }}/vpn-auth.pid
          VPN_LOG_FILE: ${{ runner.temp }}/vpn-auth-diagnostics/vpn.log
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          mkdir -p "$VPN_DIAGNOSTICS_DIR"
          nohup python3 vpn_remote_auth.py \
            > "$VPN_LOG_FILE" \
            2>&1 &
          vpn_pid=$!
          echo "$vpn_pid" > "$VPN_PID_FILE"

          sleep 1
          if ! kill -0 "$vpn_pid" 2>/dev/null; then
            cat "$VPN_LOG_FILE"
            exit 1
          fi

      - name: Wait for VPN readiness
        id: vpn_wait
        shell: bash
        run: |
          for attempt in {1..180}; do
            if test -f "$RUNNER_TEMP/vpn-ready"; then
              exit 0
            fi

            if test -f "$RUNNER_TEMP/vpn-failed"; then
              cat "$RUNNER_TEMP/vpn-failed"
              exit 1
            fi

            if test -f "$RUNNER_TEMP/vpn-auth.pid"; then
              vpn_pid=$(<"$RUNNER_TEMP/vpn-auth.pid")
              if ! kill -0 "$vpn_pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/vpn-auth-diagnostics/vpn.log"
                exit 1
              fi
            fi

            sleep 1
          done

          echo "VPN did not become ready"
          exit 1

      - name: Verify SSH over VPN
        id: ssh
        timeout-minutes: 1
        run: |
          ssh -T -i ~/.ssh/cluster \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o NumberOfPasswordPrompts=0 \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            "${{ secrets.SSH_USER }}@${{ secrets.CLUSTER_IP_ADDRESS }}" \
            true

      - name: Deploy source and test container
        id: deploy
        timeout-minutes: 20
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.bundle.outputs.archive }}
          IMAGE_PATH: ${{ steps.container.outputs.image }}
          IMAGE_BYTES: ${{ steps.container.outputs.image_bytes }}
          CLUSTER_PROJECT_ROOT: ${{ vars.CLUSTER_PROJECT_ROOT }}
        run: |
          set -euxo pipefail

          if [[ -n "$CLUSTER_PROJECT_ROOT" && ! "$CLUSTER_PROJECT_ROOT" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "CLUSTER_PROJECT_ROOT contains unsupported characters" >&2
            exit 1
          fi

          if [[ ! "$IMAGE_BYTES" =~ ^[1-9][0-9]*$ ]]; then
            echo "Container image size is invalid: $IMAGE_BYTES" >&2
            exit 1
          fi

          target="${{ secrets.SSH_USER }}@${{ secrets.CLUSTER_IP_ADDRESS }}"
          ssh_options=(
            -i ~/.ssh/cluster
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o NumberOfPasswordPrompts=0
            -o ConnectTimeout=30
            -o ConnectionAttempts=2
          )

          printf -v layout_arguments '%q ' \
            "$CLUSTER_PROJECT_ROOT" \
            "$GITHUB_SHA" \
            "$IMAGE_BYTES"
          release_dir="$(
            ssh "${ssh_options[@]}" "$target" \
              "bash -s -- $layout_arguments" <<'REMOTE_LAYOUT'
          set -euo pipefail

          requested_root="$1"
          commit_sha="$2"
          image_bytes="$3"
          required_kib=$(( (image_bytes + 1023) / 1024 + 524288 ))
          candidates=()

          if [[ -n "$requested_root" ]]; then
            candidates+=("$requested_root")
          else
            [[ -n "${SCRATCH:-}" ]] && candidates+=("${SCRATCH%/}/AMSC-Nbody-ci")
            [[ -n "${WORK:-}" ]] && candidates+=("${WORK%/}/AMSC-Nbody-ci")
            candidates+=("${HOME%/}/AMSC-Nbody-ci")
          fi

          release_dir=""
          for candidate in "${candidates[@]}"; do
            releases_root="${candidate%/}/releases"
            if [[ -d "$releases_root" ]]; then
              shopt -s nullglob
              for stale_release in "$releases_root"/*; do
                [[ -d "$stale_release" ]] || continue
                [[ -e "$stale_release/.deployment-complete" ]] && continue

                stale_artifacts=(
                  "$stale_release/source.tar.gz"
                  "$stale_release/nbody-tests.sif"
                  "$stale_release"/.nbody-tests-*.sif.part
                )
                reclaimed_bytes=0
                for stale_artifact in "${stale_artifacts[@]}"; do
                  [[ -f "$stale_artifact" ]] || continue
                  artifact_bytes="$(stat --format=%s "$stale_artifact" 2>/dev/null || echo 0)"
                  rm -f -- "$stale_artifact"
                  reclaimed_bytes=$((reclaimed_bytes + artifact_bytes))
                done

                if (( reclaimed_bytes > 0 )); then
                  printf 'Removed %s bytes of incomplete automation artifacts from %s\n' \
                    "$reclaimed_bytes" \
                    "$stale_release" >&2
                fi
                rmdir "$stale_release" 2>/dev/null || true
              done
              shopt -u nullglob
            fi

            candidate_release="${candidate%/}/releases/$commit_sha"
            if ! mkdir -p "$candidate_release" 2>/dev/null; then
              printf 'Cluster storage is not writable: %s\n' "$candidate" >&2
              continue
            fi

            candidate="$(cd "$candidate" && pwd -P)"
            available_kib="$(df -Pk "$candidate" | awk 'NR == 2 { print $4 }')"
            if [[ "$available_kib" =~ ^[0-9]+$ ]] && (( available_kib >= required_kib )); then
              release_dir="${candidate%/}/releases/$commit_sha"
              printf 'Using cluster storage %s (%s KiB available)\n' \
                "$candidate" \
                "$available_kib" >&2
              break
            fi

            printf 'Cluster storage has insufficient space: %s (%s KiB available, %s KiB required)\n' \
              "$candidate" \
              "${available_kib:-unknown}" \
              "$required_kib" >&2
          done

          if [[ -z "$release_dir" ]]; then
            echo "No cluster filesystem has enough room for the test container." >&2
            echo "Set CLUSTER_PROJECT_ROOT to a shared scratch or work filesystem." >&2
            exit 1
          fi

          printf '%s\n' "$release_dir"
          REMOTE_LAYOUT
          )"

          remote_archive="$release_dir/source.tar.gz"
          remote_image="$release_dir/.nbody-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sif.part"
          cleanup_remote_upload() {
            ssh "${ssh_options[@]}" "$target" \
              "rm -f '$remote_image'" || true
          }
          trap cleanup_remote_upload ERR INT TERM

          scp "${ssh_options[@]}" \
            "$ARCHIVE_PATH" \
            "$target:$remote_archive"
          scp "${ssh_options[@]}" \
            "$IMAGE_PATH" \
            "$target:$remote_image"
          ssh "${ssh_options[@]}" "$target" \
            "mv '$remote_image' '$release_dir/nbody-tests.sif' && tar -xzf '$remote_archive' -C '$release_dir' && touch '$release_dir/.deployment-complete'"

          trap - ERR INT TERM

          echo "release=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Submit and wait for Slurm GoogleTests
        id: cluster_test
        timeout-minutes: 60
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.deploy.outputs.release }}
          CONTAINER_RUNTIME: ${{ vars.CLUSTER_CONTAINER_RUNTIME || 'apptainer' }}
          CONTAINER_MODULE: ${{ vars.CLUSTER_CONTAINER_MODULE }}
          CUDA_ARCHITECTURES: ${{ vars.CUDA_ARCHITECTURES || '80' }}
          SLURM_PARTITION: ${{ vars.SLURM_PARTITION }}
          SLURM_ACCOUNT: ${{ vars.SLURM_ACCOUNT }}
          SLURM_QOS: ${{ vars.SLURM_QOS }}
          SLURM_CPUS: ${{ vars.SLURM_CPUS_PER_TASK || '8' }}
          SLURM_MEMORY: ${{ vars.SLURM_MEMORY || '16G' }}
          SLURM_WALLTIME: ${{ vars.SLURM_WALLTIME || '00:30:00' }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euxo pipefail

          for value in \
            "$RELEASE_DIR" \
            "$CONTAINER_RUNTIME" \
            "$CONTAINER_MODULE" \
            "$CUDA_ARCHITECTURES" \
            "$SLURM_PARTITION" \
            "$SLURM_ACCOUNT" \
            "$SLURM_QOS" \
            "$SLURM_MEMORY" \
            "$SLURM_WALLTIME" \
            "$RUN_KEY"; do
            if [[ ! "$value" =~ ^[A-Za-z0-9_./\;+:=-]*$ ]]; then
              echo "A cluster configuration value contains unsupported characters" >&2
              exit 1
            fi
          done

          if [[ "$CONTAINER_RUNTIME" != "singularity" && "$CONTAINER_RUNTIME" != "apptainer" ]]; then
            echo "CLUSTER_CONTAINER_RUNTIME must be singularity or apptainer" >&2
            exit 1
          fi

          if [[ ! "$SLURM_CPUS" =~ ^[1-9][0-9]*$ ]]; then
            echo "SLURM_CPUS_PER_TASK must be a positive integer" >&2
            exit 1
          fi

          if [[ ! "$SLURM_WALLTIME" =~ ^[0-9]{2,3}:[0-5][0-9]:[0-5][0-9]$ ]]; then
            echo "SLURM_WALLTIME must use HH:MM:SS format" >&2
            exit 1
          fi

          target="${{ secrets.SSH_USER }}@${{ secrets.CLUSTER_IP_ADDRESS }}"
          ssh_options=(
            -i ~/.ssh/cluster
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o NumberOfPasswordPrompts=0
            -o ConnectTimeout=30
            -o ConnectionAttempts=2
          )
          printf -v remote_arguments '%q ' \
            "$RELEASE_DIR" \
            "$CONTAINER_RUNTIME" \
            "$CONTAINER_MODULE" \
            "$CUDA_ARCHITECTURES" \
            "$SLURM_PARTITION" \
            "$SLURM_ACCOUNT" \
            "$SLURM_QOS" \
            "$SLURM_CPUS" \
            "$SLURM_MEMORY" \
            "$SLURM_WALLTIME" \
            "$RUN_KEY"

          ssh "${ssh_options[@]}" "$target" \
            "bash -s -- $remote_arguments" <<'REMOTE_SCRIPT'
          set -euo pipefail

          release_dir="$1"
          container_runtime="$2"
          container_module="$3"
          cuda_architectures="$4"
          slurm_partition="$5"
          slurm_account="$6"
          slurm_qos="$7"
          slurm_cpus="$8"
          slurm_memory="$9"
          slurm_walltime="${10}"
          run_key="${11}"

          cd "$release_dir"
          release_dir="$PWD"
          results_dir="$release_dir/ci-results/$run_key"
          mkdir -p "$results_dir"

          if ! command -v sbatch >/dev/null 2>&1 && [[ -r /etc/profile ]]; then
            set +u
            source /etc/profile
            set -u
          fi
          command -v sbatch

          sbatch_arguments=(
            --wait
            --parsable
            --nodes=1
            --ntasks=1
            --cpus-per-task="$slurm_cpus"
            --gres=gpu:1
            --mem="$slurm_memory"
            --time="$slurm_walltime"
            --job-name=amsc-nbody-test
            --output="$results_dir/slurm-%j.out"
            --error="$results_dir/slurm-%j.out"
            --export="ALL,NBODY_SOURCE_DIR=$release_dir,NBODY_IMAGE=$release_dir/nbody-tests.sif,NBODY_TEST_MODE=all,NBODY_RESULTS_DIR=$results_dir,NBODY_CONTAINER_RUNTIME=$container_runtime,NBODY_CONTAINER_MODULE=$container_module,NBODY_CUDA_ARCHITECTURES=$cuda_architectures"
          )

          [[ -n "$slurm_partition" ]] && sbatch_arguments+=(--partition="$slurm_partition")
          [[ -n "$slurm_account" ]] && sbatch_arguments+=(--account="$slurm_account")
          [[ -n "$slurm_qos" ]] && sbatch_arguments+=(--qos="$slurm_qos")

          set +e
          submission_output="$(
            sbatch \
              "${sbatch_arguments[@]}" \
              containers/slurm-google-tests.sbatch \
              2>&1
          )"
          submission_status=$?
          set -e

          printf '%s\n' "$submission_output" | tee "$results_dir/slurm-submission.txt"
          exit "$submission_status"
          REMOTE_SCRIPT

      - name: Download cluster test results
        id: collect
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.deploy.outputs.release }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euxo pipefail

          target="${{ secrets.SSH_USER }}@${{ secrets.CLUSTER_IP_ADDRESS }}"
          results_path="$RUNNER_TEMP/cluster-test-results"
          mkdir -p "$results_path"

          scp \
            -r \
            -i ~/.ssh/cluster \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o NumberOfPasswordPrompts=0 \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=2 \
            "$target:$RELEASE_DIR/ci-results/$RUN_KEY/." \
            "$results_path/"

      - name: Stop VPN
        if: always()
        shell: bash
        run: |
          set +e

          if test -f "$RUNNER_TEMP/vpn-auth.pid"; then
            vpn_pid=$(<"$RUNNER_TEMP/vpn-auth.pid")
            if kill -0 "$vpn_pid" 2>/dev/null; then
              kill -TERM "$vpn_pid"
              for attempt in {1..30}; do
                kill -0 "$vpn_pid" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$vpn_pid" 2>/dev/null || true
            fi
          fi

          sudo -n gpclient disconnect || true

      - name: Write cluster test summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## NVIDIA cluster GoogleTests"
            echo
            echo "- Container build: \`${{ steps.container.outcome }}\`"
            echo "- VPN startup: \`${{ steps.vpn.outcome }}\`"
            echo "- VPN readiness: \`${{ steps.vpn_wait.outcome }}\`"
            echo "- SSH connectivity: \`${{ steps.ssh.outcome }}\`"
            echo "- Cluster deployment: \`${{ steps.deploy.outcome }}\`"
            echo "- Slurm GoogleTests: \`${{ steps.cluster_test.outcome }}\`"
            echo "- Result collection: \`${{ steps.collect.outcome }}\`"
            if test -f "$RUNNER_TEMP/vpn-auth-diagnostics/summary.md"; then
              echo
              cat "$RUNNER_TEMP/vpn-auth-diagnostics/summary.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VPN authentication diagnostics
        if: ${{ failure() && steps.vpn_wait.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: vpn-auth-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vpn-auth-diagnostics/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload cluster test results
        if: ${{ always() && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cluster-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cluster-test-results/
          if-no-files-found: warn
          retention-days: 14
