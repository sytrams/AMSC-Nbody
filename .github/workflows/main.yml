name: VPN SSH operation

on:
  push:
    branches:
      - main

jobs:
  connect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check runner capabilities
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          sudo -n true
          test -c /dev/net/tun
          ls -l /dev/net/tun

      - name: Install GlobalProtect client
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          APT_OPTIONS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Dpkg::Lock::Timeout=30
            -o Dpkg::Use-Pty=0
          )

          GP_VERSION="2.6.5"
          GP_DEB="globalprotect-openconnect_${GP_VERSION}-1_amd64.deb"
          GP_SHA256="17b86bffd68611883fbb28ce03c9baddf5e7d2fe7905e22c3ae77ce2531e573b"
          GP_URL="https://github.com/yuezk/GlobalProtect-openconnect/releases/download/v${GP_VERSION}/${GP_DEB}"
          GP_PATH="$RUNNER_TEMP/$GP_DEB"

          timeout --signal=INT --kill-after=10s 4m \
            sudo apt-get "${APT_OPTIONS[@]}" update

          timeout --signal=INT --kill-after=10s 4m \
            sudo apt-get "${APT_OPTIONS[@]}" install -y \
              ca-certificates \
              curl \
              netcat-openbsd \
              openssh-client

          timeout --signal=INT --kill-after=10s 3m \
            curl \
              --fail \
              --location \
              --show-error \
              --silent \
              --retry 5 \
              --retry-all-errors \
              --connect-timeout 20 \
              --max-time 150 \
              "$GP_URL" \
              --output "$GP_PATH"

          printf '%s  %s\n' "$GP_SHA256" "$GP_PATH" \
            | sha256sum --check --strict

          (
            cd "$RUNNER_TEMP"
            timeout --signal=INT --kill-after=10s 4m \
              sudo apt-get "${APT_OPTIONS[@]}" install -y "./$GP_DEB"
          )

          command -v gpclient
          command -v gpauth
          gpclient --version

      - name: Configure CINECA SSH credential
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_CERTIFICATE: ${{ secrets.SSH_CERTIFICATE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cineca
          printf '%s\n' "$SSH_CERTIFICATE" > ~/.ssh/cineca-cert.pub
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cineca ~/.ssh/known_hosts
          chmod 644 ~/.ssh/cineca-cert.pub

      - name: Install Python and browser dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install -r requirements.txt

          python -m playwright install --with-deps chromium

      - name: Authenticate and keep VPN connected
        id: vpn
        background: true
        shell: bash
        env:
          POLIMI_USERNAME: ${{secrets.POLIMI_USER}}
          POLIMI_PASSWORD: ${{secrets.POLIMI_PASSWORD}}
          POLIMI_TOTP: ${{secrets.POLIMI_TOTP}}
          POLIMI_VPN: ${{secrets.POLIMI_VPN}}
          VPN_READY_FILE: ${{ runner.temp }}/vpn-ready
          VPN_FAILED_FILE: ${{ runner.temp }}/vpn-failed
          VPN_DIAGNOSTICS_DIR: ${{ runner.temp }}/vpn-auth-diagnostics
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          final_ready="$VPN_READY_FILE"
          final_failed="$VPN_FAILED_FILE"
          diagnostics_root="$VPN_DIAGNOSTICS_DIR"
          child_pid=""
          shutdown_requested=false

          cleanup_child() {
            if [[ -n "$child_pid" ]] && kill -0 "$child_pid" 2>/dev/null; then
              kill -TERM "$child_pid" 2>/dev/null || true
              wait "$child_pid" 2>/dev/null || true
            fi

            rm -f "$final_ready"
          }

          request_shutdown() {
            shutdown_requested=true
            cleanup_child
          }

          trap request_shutdown INT TERM
          trap cleanup_child EXIT

          publish_diagnostics() {
            local attempt_dir="$1"

            mkdir -p "$diagnostics_root"

            rm -f \
              "$diagnostics_root/summary.md" \
              "$diagnostics_root/failure.json" \
              "$diagnostics_root/failure.png"

            local file

            for file in summary.md failure.json failure.png; do
              if [[ -f "$attempt_dir/$file" ]]; then
                cp "$attempt_dir/$file" "$diagnostics_root/$file"
              fi
            done
          }

          retryable_failure() {
            local message="$1"

            grep -Eqi \
              'gpclient (output ended|exited) before VPN readiness|VPN readiness was not detected|Connection timed out|tcp connect error|Network error|error sending request|Connection reset|temporarily unavailable|OpenConnect exited|Invalid authentication cookie|Could not load the (portal|gateway) authentication page|Timed out after .* waiting for (portal|gateway) authentication' \
              <<<"$message"
          }

          rm -f "$final_ready" "$final_failed"
          mkdir -p "$diagnostics_root"

          # Startup failures are common when the VPN endpoint is temporarily
          # unreachable. Five attempts span roughly eight minutes when the
          # observed 30-second TCP timeouts are included.
          startup_delays=(20 40 80 120)
          startup_max_attempts=5

          # Once a tunnel has worked, keep trying to restore it until this
          # background step is cancelled. The job timeout remains the outer
          # bound, while capped backoff avoids hammering the VPN endpoint.
          reconnect_delays=(10 20 40 60 90)

          attempt=0
          startup_failures=0
          reconnect_failures=0
          ever_connected=false

          while true; do
            [[ "$shutdown_requested" == true ]] && exit 0

            ((attempt += 1))
            attempt_ready="$RUNNER_TEMP/vpn-ready-attempt-$attempt"
            attempt_failed="$RUNNER_TEMP/vpn-failed-attempt-$attempt"
            attempt_dir="$diagnostics_root/attempt-$attempt"
            connected_this_attempt=false

            rm -f "$attempt_ready" "$attempt_failed"
            rm -rf "$attempt_dir"
            mkdir -p "$attempt_dir"

            if [[ "$ever_connected" == true ]]; then
              echo "[vpn-wrapper] starting reconnect attempt $attempt"
            else
              echo \
                "[vpn-wrapper] starting startup attempt " \
                "$((startup_failures + 1))/$startup_max_attempts"
            fi

            VPN_READY_FILE="$attempt_ready" \
            VPN_FAILED_FILE="$attempt_failed" \
            VPN_DIAGNOSTICS_DIR="$attempt_dir" \
              python3 vpn_remote_auth.py &

            child_pid=$!

            while kill -0 "$child_pid" 2>/dev/null; do
              if [[ -f "$attempt_ready" ]]; then
                publish_diagnostics "$attempt_dir"

                ready_tmp="$final_ready.$$.tmp"
                printf 'ready\n' > "$ready_tmp"
                mv "$ready_tmp" "$final_ready"

                echo "[vpn-wrapper] VPN connected on attempt $attempt"
                connected_this_attempt=true
                ever_connected=true
                reconnect_failures=0
                break
              fi

              sleep 1
            done

            set +e
            wait "$child_pid"
            status=$?
            set -e

            child_pid=""
            rm -f "$final_ready"

            [[ "$shutdown_requested" == true ]] && exit 0

            failure="vpn_remote_auth.py exited with status $status"

            if [[ -s "$attempt_failed" ]]; then
              failure="$(<"$attempt_failed")"
            fi

            publish_diagnostics "$attempt_dir"

            if (( status == 0 )); then
              status=1
            fi

            if [[ "$connected_this_attempt" == true ]]; then
              # A completed browser authentication proves the credentials are
              # usable. Treat any later tunnel loss as recoverable, including
              # the observed OpenConnect "Invalid authentication cookie" exit.
              ((reconnect_failures += 1))
              delay="${reconnect_delays[0]}"
              echo \
                "[vpn-wrapper] established VPN connection dropped; " \
                "reconnecting in ${delay}s" >&2
              sleep "$delay"
              continue
            fi

            if ! retryable_failure "$failure"; then
              printf '%s\n' "$failure" > "$final_failed"
              echo "$failure" >&2
              exit "$status"
            fi

            if [[ "$ever_connected" == true ]]; then
              ((reconnect_failures += 1))
              delay_index=$((reconnect_failures - 1))
              if (( delay_index >= ${#reconnect_delays[@]} )); then
                delay_index=$((${#reconnect_delays[@]} - 1))
              fi
              delay="${reconnect_delays[$delay_index]}"

              echo \
                "[vpn-wrapper] reconnect failed transiently; " \
                "retrying in ${delay}s" >&2
              sleep "$delay"
              continue
            fi

            ((startup_failures += 1))
            if (( startup_failures >= startup_max_attempts )); then
              printf '%s\n' "$failure" > "$final_failed"
              echo "$failure" >&2
              exit "$status"
            fi

            delay="${startup_delays[$((startup_failures - 1))]}"

            echo \
              "[vpn-wrapper] transient VPN startup failure; " \
              "retrying in ${delay}s" >&2
            sleep "$delay"
          done

      - name: Wait for VPN readiness
        id: vpn_wait
        shell: bash
        run: |
          for attempt in {1..720}; do
            if test -f "$RUNNER_TEMP/vpn-ready"; then
              exit 0
            fi

            if test -f "$RUNNER_TEMP/vpn-failed"; then
              cat "$RUNNER_TEMP/vpn-failed"
              exit 1
            fi

            sleep 1
          done

          echo "VPN did not become ready after all retry attempts"
          exit 1

      - name: Verify SSH over VPN
        id: ssh
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail

          wait_for_vpn() {
            for _ in {1..600}; do
              [[ -f "$RUNNER_TEMP/vpn-ready" ]] && return 0

              if [[ -s "$RUNNER_TEMP/vpn-failed" ]]; then
                cat "$RUNNER_TEMP/vpn-failed" >&2
                return 1
              fi

              sleep 1
            done

            echo "Timed out waiting for the VPN to reconnect" >&2
            return 1
          }

          for attempt in {1..6}; do
            wait_for_vpn

            set +e
            ssh -T -i ~/.ssh/cineca \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o NumberOfPasswordPrompts=0 \
              -o ConnectTimeout=15 \
              -o ConnectionAttempts=1 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              "${{ secrets.SSH_USER }}@${{ secrets.CLUSTER_IP_ADDRESS }}" \
              true
            status=$?
            set -e

            (( status == 0 )) && exit 0
            (( status != 255 )) && exit "$status"

            echo \
              "SSH connectivity attempt $attempt/6 was interrupted; " \
              "waiting for the VPN" >&2
            sleep 5
          done

          echo "SSH remained unavailable after VPN recovery attempts" >&2
          exit 1

      - name: Run tests on a PBS GPU node
        id: tests
        timeout-minutes: 60
        shell: bash
        env:
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          wait_for_vpn() {
            for _ in {1..600}; do
              [[ -f "$RUNNER_TEMP/vpn-ready" ]] && return 0

              if [[ -s "$RUNNER_TEMP/vpn-failed" ]]; then
                cat "$RUNNER_TEMP/vpn-failed" >&2
                return 1
              fi

              sleep 1
            done

            echo "Timed out waiting for the VPN to reconnect" >&2
            return 1
          }

          target="${{ secrets.SSH_USER }}@${{ secrets.CLUSTER_IP_ADDRESS }}"
          ssh_options=(
            -T
            -i ~/.ssh/cineca
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o NumberOfPasswordPrompts=0
            -o ConnectTimeout=30
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          printf -v remote_arguments '%q ' "$RUN_KEY"

          results_path="$RUNNER_TEMP/cluster-test-results"
          mkdir -p "$results_path"
          orchestration_log="$results_path/orchestration.log"
          : > "$orchestration_log"

          for orchestration_attempt in {1..8}; do
            wait_for_vpn

            echo \
              "[orchestration] SSH attempt $orchestration_attempt/8" \
              | tee -a "$orchestration_log"

            set +e
            {
            ssh "${ssh_options[@]}" "$target" \
              "bash -l -s -- $remote_arguments" <<'REMOTE_SCRIPT'
          set -euo pipefail

          run_key="$1"
          repository="$HOME/AMSC-Nbody-fresh"
          results_dir="$repository/.ci-results/$run_key"
          dispatch_file="$results_dir/pbs-dispatch.txt"
          submission_lock="$results_dir/pbs-submission.lock"
          mkdir -p "$results_dir"

          if [[ -r /etc/profile.d/pbs.sh ]]; then
            set +u
            source /etc/profile.d/pbs.sh
            set -u
          fi

          for required_command in qsub qstat; do
            if ! command_path="$(command -v "$required_command")"; then
              echo "Required cluster command is unavailable: $required_command" >&2
              echo "Remote PATH: $PATH" >&2
              exit 127
            fi
            printf 'Using %s: %s\n' "$required_command" "$command_path"
          done

          read_job_id() {
            [[ -s "$dispatch_file" ]] || return 0
            sed -n 's/^job_id=//p' "$dispatch_file" \
              | head -n 1
          }

          job_id="$(read_job_id)"

          if [[ -z "$job_id" ]]; then
            if mkdir "$submission_lock" 2>/dev/null; then
              cleanup_submission_lock() {
                rmdir "$submission_lock" 2>/dev/null || true
              }
              trap cleanup_submission_lock EXIT

              # Recheck after acquiring the lock in case another SSH session
              # published the dispatch marker while this one was waiting.
              job_id="$(read_job_id)"

              if [[ -z "$job_id" ]]; then
                cd "$repository"
                git pull --ff-only

                job_environment="NBODY_REPOSITORY=$repository"
                job_environment+=",NBODY_RESULTS_DIR=$results_dir"
                job_id="$(
                  qsub \
                    -q gpu \
                    -l walltime=00:30:00 \
                    -N amsc-nbody-tests \
                    -j oe \
                    -o "$results_dir/pbs-job.out" \
                    -v "$job_environment" <<'PBS_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          live_log="$NBODY_RESULTS_DIR/pbs-live.log"
          stage_file="$NBODY_RESULTS_DIR/current-stage.txt"
          status_file="$NBODY_RESULTS_DIR/pbs-status.txt"
          : > "$live_log"
          exec >> "$live_log" 2>&1

          mark_stage() {
            printf '%s\n' "$1" > "$stage_file"
            printf '[pbs] stage: %s\n' "$1"
          }

          record_exit_status() {
            status=$?
            set +e

            stage="unknown"
            if [[ -s "$stage_file" ]]; then
              IFS= read -r stage < "$stage_file"
            fi

            {
              printf 'exit_code=%s\n' "$status"
              printf 'stage=%s\n' "$stage"
              printf 'host=%s\n' "$(hostname -f 2>/dev/null || hostname 2>/dev/null || printf unknown)"
            } > "$status_file"

            if (( status == 0 )); then
              printf '[pbs] completed successfully at stage: %s\n' "$stage"
            else
              printf '[pbs] failed with exit code %s at stage: %s\n' \
                "$status" "$stage" >&2
            fi

            # This is the completion marker observed by the login-node process.
            # Write it last, after every diagnostic file has been flushed.
            printf '%s\n' "$status" > "$NBODY_RESULTS_DIR/test-exit-code"
          }
          trap record_exit_status EXIT

          mark_stage "checking compute-node prerequisites"
          if ! command -v apptainer >/dev/null 2>&1; then
            echo "Required compute-node command is unavailable: apptainer" >&2
            echo "Compute-node PATH: $PATH" >&2
            exit 127
          fi

          mark_stage "starting the NVHPC container"
          apptainer exec \
            --nv \
            --bind "$NBODY_REPOSITORY:$NBODY_REPOSITORY" \
            --bind "$NBODY_RESULTS_DIR:$NBODY_RESULTS_DIR" \
            /software/containers/nvhpc/nvhpc.sif \
            bash -se -- "$NBODY_REPOSITORY" "$NBODY_RESULTS_DIR" <<'CONTAINER_SCRIPT'
          set -Eeuo pipefail

          repository="$1"
          results_dir="$2"

          mark_stage() {
            printf '%s\n' "$1" > "$results_dir/current-stage.txt"
            printf '[container] stage: %s\n' "$1"
          }

          # CMake and the project tests provide the real compiler/GPU checks.
          # Do not depend on sample sources outside the container image.
          mark_stage "checking the CUDA compiler"
          command -v nvcc
          nvcc --version

          mark_stage "configuring the CMake test build"
          cd "$repository"
          cmake -S . -B build/all-tests \
            -DBUILD_TESTING=ON \
            -DNBODY_ENABLE_CUDA=ON \
            -DNBODY_BUILD_SIMULATION=ON \
            -DNBODY_BUILD_VIEWER=OFF
          mark_stage "building the CMake test suite"
          cmake --build build/all-tests --parallel

          mark_stage "running CTest"
          set +e
          ctest \
            --test-dir build/all-tests \
            --output-on-failure \
            --no-tests=error \
            --output-junit "$results_dir/ctest-results.xml" \
            2>&1 | tee "$results_dir/ctest-output.log"
          ctest_status=${PIPESTATUS[0]}
          set -e

          if (( ctest_status != 0 )); then
            exit "$ctest_status"
          fi

          # A skipped CUDA test on an allocated GPU node means the requested
          # suite did not fully execute, so treat it as an automation failure.
          if grep -q '<skipped' "$results_dir/ctest-results.xml"; then
            echo "CTest reported one or more skipped tests" >&2
            exit 1
          fi

          mark_stage "completed all tests"
          CONTAINER_SCRIPT
          PBS_SCRIPT
                )"

                dispatch_tmp="$dispatch_file.$$.tmp"
                printf 'job_id=%s\n' "$job_id" > "$dispatch_tmp"
                mv "$dispatch_tmp" "$dispatch_file"
                printf 'Submitted PBS job %s\n' "$job_id"
              fi

              cleanup_submission_lock
              trap - EXIT
            else
              # A previous SSH session may still be finishing qsub. Wait for
              # its atomic marker rather than risking a duplicate GPU job.
              for _ in {1..60}; do
                [[ -s "$dispatch_file" ]] && break
                sleep 1
              done
              job_id="$(read_job_id)"

              if [[ -z "$job_id" ]]; then
                echo "PBS submission is still owned by another SSH session" >&2
                exit 75
              fi
            fi
          else
            printf 'Resuming PBS job %s after SSH reconnect\n' "$job_id"
          fi

          if [[ ! "$job_id" =~ ^[[:alnum:]_.-]+$ ]]; then
            echo "Invalid PBS job identifier: $job_id" >&2
            exit 1
          fi

          job_finished=false
          missing_state_polls=0
          last_job_state=""
          for attempt in {1..330}; do
            if [[ -s "$results_dir/test-exit-code" ]]; then
              job_finished=true
              break
            fi

            job_state="$(
              qstat -f "$job_id" 2>/dev/null \
                | awk '$1 == "job_state" { print $3; exit }' \
                || true
            )"

            if [[ "$job_state" != "$last_job_state" ]]; then
              printf 'PBS job state: %s\n' "${job_state:-not visible}"
              last_job_state="$job_state"
            fi

            case "$job_state" in
              F|X)
                job_finished=true
                break
                ;;
              "")
                ((missing_state_polls += 1))
                # A finished job may disappear from qstat before its spool files
                # are copied. Allow one minute for the direct completion marker.
                if (( missing_state_polls >= 6 )); then
                  job_finished=true
                  break
                fi
                sleep 10
                ;;
              *)
                missing_state_polls=0
                sleep 10
                ;;
            esac
          done

          if [[ "$job_finished" != true ]]; then
            echo "Timed out waiting for PBS job $job_id" >&2
            exit 1
          fi

          for attempt in {1..12}; do
            [[ -s "$results_dir/test-exit-code" ]] && break
            sleep 5
          done

          if ! qstat -xf "$job_id" > "$results_dir/pbs-qstat.txt" 2>&1; then
            qstat -f "$job_id" >> "$results_dir/pbs-qstat.txt" 2>&1 || true
          fi

          for job_log in pbs-live.log pbs-job.out; do
            if [[ -f "$results_dir/$job_log" ]]; then
              printf '\n===== %s =====\n' "$job_log"
              cat "$results_dir/$job_log" || true
            fi
          done

          if [[ ! -f "$results_dir/pbs-live.log" ]]; then
            echo "PBS job did not produce the direct live log" >&2
          fi

          if [[ ! -s "$results_dir/test-exit-code" ]]; then
            echo "PBS job $job_id did not produce a test exit code" >&2
            exit 1
          fi

          test_exit_code="$(<"$results_dir/test-exit-code")"
          if [[ ! "$test_exit_code" =~ ^[0-9]+$ ]]; then
            echo "Invalid test exit code: $test_exit_code" >&2
            exit 1
          fi

          # Publish an explicit status marker. This is more reliable than using
          # only the SSH process status after a long-running remote session.
          printf 'NBODY_CI_TEST_EXIT_CODE=%s\n' "$test_exit_code"
          exit "$test_exit_code"
          REMOTE_SCRIPT
            } 2>&1 | tee -a "$orchestration_log"
            ssh_status=${PIPESTATUS[0]}
            set -e

            reported_test_status="$(
              sed -n \
                's/^NBODY_CI_TEST_EXIT_CODE=\([0-9][0-9]*\)$/\1/p' \
                "$orchestration_log" \
                | tail -n 1
            )"

            if [[ "$reported_test_status" =~ ^[0-9]+$ ]]; then
              if (( ssh_status != reported_test_status )); then
                printf \
                  'SSH returned %s after the remote job reported test status %s; using the explicit test status.\n' \
                  "$ssh_status" "$reported_test_status" >&2
              fi
              exit "$reported_test_status"
            fi

            if (( ssh_status != 255 && ssh_status != 75 )); then
              echo "Remote orchestration failed with status $ssh_status" >&2
              exit "$ssh_status"
            fi

            echo \
              "[orchestration] SSH was interrupted before the remote test " \
              "status arrived; waiting for VPN recovery" \
              | tee -a "$orchestration_log" >&2
            sleep 5
          done

          echo "Remote test status was not received after 8 SSH attempts" >&2
          exit 1

      - name: Download test results
        id: collect_tests
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        timeout-minutes: 12
        shell: bash
        env:
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          wait_for_vpn() {
            for _ in {1..600}; do
              [[ -f "$RUNNER_TEMP/vpn-ready" ]] && return 0

              if [[ -s "$RUNNER_TEMP/vpn-failed" ]]; then
                cat "$RUNNER_TEMP/vpn-failed" >&2
                return 1
              fi

              sleep 1
            done

            echo "Timed out waiting for the VPN to reconnect" >&2
            return 1
          }

          results_path="$RUNNER_TEMP/cluster-test-results"
          mkdir -p "$results_path"

          for attempt in {1..6}; do
            wait_for_vpn

            set +e
            scp \
              -r \
              -i ~/.ssh/cineca \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o NumberOfPasswordPrompts=0 \
              -o ConnectTimeout=30 \
              -o ConnectionAttempts=2 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              "${{ secrets.SSH_USER }}@${{ secrets.CLUSTER_IP_ADDRESS }}:AMSC-Nbody-fresh/.ci-results/$RUN_KEY/." \
              "$results_path/"
            status=$?
            set -e

            (( status == 0 )) && exit 0
            (( status != 255 )) && exit "$status"

            echo \
              "SCP attempt $attempt/6 was interrupted; waiting for the VPN" \
              >&2
            sleep 5
          done

          echo "Could not collect results after VPN recovery attempts" >&2
          exit 1

      - name: Stop VPN
        cancel: vpn

      - name: Emergency VPN cleanup
        if: always()
        shell: bash
        run: sudo -n gpclient disconnect || true

      - name: Write automation summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## VPN authentication and connectivity"
            echo
            echo "- VPN background process: \`${{ steps.vpn.outcome }}\`"
            echo "- VPN readiness check: \`${{ steps.vpn_wait.outcome }}\`"
            echo "- SSH connectivity check: \`${{ steps.ssh.outcome }}\`"
            echo "- PBS GPU tests: \`${{ steps.tests.outcome }}\`"
            echo "- Test-result collection: \`${{ steps.collect_tests.outcome }}\`"
            if test -f "$RUNNER_TEMP/vpn-auth-diagnostics/summary.md"; then
              echo
              cat "$RUNNER_TEMP/vpn-auth-diagnostics/summary.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          python3 <<'PYTHON'
          import os
          import html
          from pathlib import Path
          import xml.etree.ElementTree as ET

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          results_path = Path(os.environ["RUNNER_TEMP"]) / "cluster-test-results"
          junit_path = results_path / "ctest-results.xml"
          orchestration_log = results_path / "orchestration.log"
          pbs_live_log = results_path / "pbs-live.log"
          pbs_spool_log = results_path / "pbs-job.out"
          pbs_status_path = results_path / "pbs-status.txt"
          pbs_dispatch_path = results_path / "pbs-dispatch.txt"

          def read_key_values(*paths: Path) -> dict[str, str]:
              values: dict[str, str] = {}
              for path in paths:
                  if not path.is_file():
                      continue
                  for line in path.read_text(
                      encoding="utf-8", errors="replace"
                  ).splitlines():
                      key, separator, value = line.partition("=")
                      if separator and key.strip():
                          values[key.strip()] = value.strip()
              return values

          def read_log_excerpt(path: Path, line_limit: int = 40) -> str:
              lines = path.read_text(
                  encoding="utf-8", errors="replace"
              ).splitlines()
              return "\n".join(lines[-line_limit:])[-8000:]

          with summary_path.open("a", encoding="utf-8") as summary:
              print(file=summary)
              print("## Test results", file=summary)
              print(file=summary)

              if not junit_path.is_file():
                  print(
                      "CTest did not produce a JUnit report. The failure happened "
                      "before CTest completed, or the remote job could not start.",
                      file=summary,
                  )

                  pbs_status = read_key_values(
                      pbs_dispatch_path,
                      pbs_status_path,
                  )
                  if pbs_status:
                      print(file=summary)
                      print("### PBS failure details", file=summary)
                      print(file=summary)
                      if job_id := pbs_status.get("job_id"):
                          print(f"- Job: `{job_id}`", file=summary)
                      if exit_code := pbs_status.get("exit_code"):
                          print(f"- Exit code: `{exit_code}`", file=summary)
                      if stage := pbs_status.get("stage"):
                          print(f"- Last stage: `{stage}`", file=summary)
                      if host := pbs_status.get("host"):
                          print(f"- Compute host: `{host}`", file=summary)

                  diagnostic_log = next(
                      (
                          path
                          for path in (
                              pbs_live_log,
                              pbs_spool_log,
                              orchestration_log,
                          )
                          if path.is_file() and path.stat().st_size
                      ),
                      None,
                  )
                  if diagnostic_log is not None:
                      excerpt = read_log_excerpt(diagnostic_log)
                      if excerpt:
                          print(file=summary)
                          print("<details>", file=summary)
                          print(
                              f"<summary>Last messages from "
                              f"{diagnostic_log.name}</summary>",
                              file=summary,
                          )
                          print(file=summary)
                          print(f"<pre>{html.escape(excerpt)}</pre>", file=summary)
                          print("</details>", file=summary)
              else:
                  try:
                      root = ET.parse(junit_path).getroot()
                  except (ET.ParseError, OSError) as error:
                      print(f"CTest result XML could not be read: `{error}`", file=summary)
                  else:
                      cases = list(root.iter("testcase"))
                      failed = []
                      skipped = []

                      for case in cases:
                          failure = case.find("failure")
                          error = case.find("error")
                          suite = case.get("classname", "").strip()
                          name = case.get("name", "unnamed test").strip()
                          label = f"{suite}.{name}" if suite else name

                          problem = failure if failure is not None else error
                          if problem is not None:
                              message = (problem.get("message") or "").strip()
                              output = (problem.text or "").strip()
                              details = "\n".join(
                                  part for part in (message, output) if part
                              )
                              failed.append((label, details))
                          elif case.find("skipped") is not None:
                              skipped.append(label)

                      passed = len(cases) - len(failed) - len(skipped)
                      print(
                          f"- Total: **{len(cases)}**; passed: **{passed}**; "
                          f"failed: **{len(failed)}**; skipped: **{len(skipped)}**",
                          file=summary,
                      )

                      if failed:
                          print(file=summary)
                          print(f"### Failed tests ({len(failed)})", file=summary)
                          print(file=summary)
                          for name, details in failed:
                              safe_name = name.replace("`", "'")
                              print(f"- `{safe_name}`", file=summary)
                              if details:
                                  # Keep the summary useful without approaching
                                  # GitHub's per-step summary size limit.
                                  excerpt = details[-4000:]
                                  print(file=summary)
                                  print("  <details>", file=summary)
                                  print("  <summary>Failure output</summary>", file=summary)
                                  print(file=summary)
                                  print(f"  <pre>{html.escape(excerpt)}</pre>", file=summary)
                                  print("  </details>", file=summary)

                      if skipped:
                          print(file=summary)
                          print(f"### Skipped tests ({len(skipped)})", file=summary)
                          print(file=summary)
                          for name in skipped:
                              safe_name = name.replace("`", "'")
                              print(f"- `{safe_name}`", file=summary)

                      if cases and not failed and not skipped:
                          print(file=summary)
                          print(f"✅ All {len(cases)} tests passed.", file=summary)
                      elif cases and not failed:
                          print(file=summary)
                          print(
                              "No tests failed, but not every test ran to completion.",
                              file=summary,
                          )
                      elif not cases:
                          print(file=summary)
                          print("CTest did not report any tests.", file=summary)
          PYTHON

      - name: Upload VPN authentication diagnostics
        if: ${{ failure() && steps.vpn_wait.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: vpn-auth-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vpn-auth-diagnostics/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload cluster test results
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: cluster-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cluster-test-results/
          if-no-files-found: warn
          retention-days: 14
