name: N-bodies-BONSAY CI/CD

run-name: ${{ github.actor }} is testing out GitHub Actions

on: 
  push:
    branches: main

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          set -euo pipefail
          wget https://github.com/sylabs/singularity/releases/download/v4.4.2/singularity-ce_4.4.2-noble_amd64.deb
          sudo apt-get install -y ./singularity-ce_4.4.2-noble_amd64.deb
          sudo add-apt-repository -y ppa:yuezk/globalprotect-openconnect
          sudo apt-get update
          sudo apt-get install -y globalprotect-openconnect
                  
      # - name: Build the container
      #   run: singularity build --fakeroot singularity.sif Singularity.def

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Connect VPN And Verify Cluster Access
        env:
          PORTAL: ${{ secrets.PORTAL }}
          POLIMI_USERNAME: ${{ secrets.POLIMI_PERSON_CODE || secrets.POLIMI_USERNAME || secrets.USERNAME }}
          POLIMI_PASSWORD: ${{ secrets.PASSWORD }}
          POLIMI_OTP_SECRET: ${{ secrets.OTP_KEY_GEN }}
          POLIMI_CLUSTER_USER: ${{ secrets.POLIMI_CLUSTER_USER || secrets.USERNAME }}
          POLIMI_CLUSTER_HOST: 10.78.18.100
          SSH_PRIV: ${{ secrets.SSH_PRIV }}
          GPAUTH_FIX_OPENSSL: "1"
          GPCLIENT_FIX_OPENSSL: "1"
        run: |
          set -euo pipefail

          eval "$(ssh-agent -s)"
          trap 'sudo gpclient disconnect || true; ssh-agent -k >/dev/null || true' EXIT

          printf '%s\n' "$SSH_PRIV" | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          PORTAL_COOKIE="$(python3 vpn_remote_auth.py --portal "$PORTAL" --print-cookie-only)"

          : > /tmp/portal-probe.log
          printf '%s\n' "$PORTAL_COOKIE" | stdbuf -oL -eL sudo gpclient --fix-openssl connect "$PORTAL" --cookie-on-stdin \
            > /tmp/portal-probe.log 2>&1 &
          PORTAL_PROBE_PID=$!

          GATEWAY_HOST=""
          for attempt in $(seq 1 30); do
            if grep -Eo 'Connecting to the only available gateway: .+ \(([^)]+)\)' /tmp/portal-probe.log > /tmp/gateway-line.txt 2>/dev/null; then
              GATEWAY_HOST="$(sed -E 's/.*\(([^)]+)\)$/\1/' /tmp/gateway-line.txt | tail -n 1)"
              break
            fi
            if ! kill -0 "$PORTAL_PROBE_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ -z "$GATEWAY_HOST" ]]; then
            echo "Could not determine gateway host from portal probe." >&2
            cat /tmp/portal-probe.log >&2 || true
            exit 1
          fi

          echo "Resolved gateway host: $GATEWAY_HOST"

          sudo gpclient disconnect || true
          wait "$PORTAL_PROBE_PID" || true

          GATEWAY_COOKIE="$(python3 vpn_remote_auth.py --portal "$GATEWAY_HOST" --gateway --print-cookie-only)"

          : > /tmp/gpclient.log
          printf '%s\n' "$GATEWAY_COOKIE" | stdbuf -oL -eL sudo gpclient --fix-openssl connect "$GATEWAY_HOST" --as-gateway --cookie-on-stdin \
            > /tmp/gpclient.log 2>&1 &
          GPCLIENT_PID=$!
          tail -f /tmp/gpclient.log >&2 &
          GPCLIENT_LOG_PID=$!

          for attempt in $(seq 1 30); do
            if ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no \
              "$POLIMI_CLUSTER_USER@$POLIMI_CLUSTER_HOST" 'hostname' > /tmp/cluster-hostname.txt 2> /tmp/cluster-ssh.log; then
              break
            fi

            if ! kill -0 "$GPCLIENT_PID" 2>/dev/null; then
              echo "gpclient exited before SSH became reachable." >&2
              cat /tmp/cluster-ssh.log >&2 || true
              exit 1
            fi

            sleep 2
          done

          if [[ ! -s /tmp/cluster-hostname.txt ]]; then
            echo "VPN came up, but SSH to the cluster host never succeeded." >&2
            cat /tmp/cluster-ssh.log >&2 || true
            exit 1
          fi

          echo "Cluster login node:"
          cat /tmp/cluster-hostname.txt

          sudo gpclient disconnect || true
          wait "$GPCLIENT_PID" || true
          kill "$GPCLIENT_LOG_PID" || true
          
      
      - name: Archive valid_data.csv
        uses: actions/upload-artifact@v7
        with:
          path: results/valid_data.csv
          archive: false
          if-no-files-found: ignore

      - name: Archive alarm.log
        uses: actions/upload-artifact@v7
        with:
          path: results/alarms.log
          archive: false
          if-no-files-found: ignore
          
