name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this runs
# the CUDA unit and integration tests on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator has no timing
# model and cannot reproduce hardware-specific behavior, so it complements
# real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gpu/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-tests:
    name: CUDA tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # 90-virtual embeds PTX only, which the simulator runs. The simulator
      # needs a shared CUDA runtime.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DNBODY_ENABLE_CUDA=ON \
            -DNBODY_BUILD_VIEWER=OFF \
            -DNBODY_BUILD_STREAMING=OFF \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared

      - name: Build
        run: vgpu run --preload cmake --build build -j3

      # Fail unless ctest really ran tests and all of them passed.
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          vgpu run ctest --test-dir build -L cuda-unit --output-on-failure --no-tests=error | tee unit.log
          grep -q "100% tests passed, 0 tests failed out of" unit.log
          if grep -qE "Not Run|\*\*\*Failed|CUDA error|SKIPPED|Skipped" unit.log; then
            echo "::error::a unit test failed or was skipped"
            exit 1
          fi

      - name: Integration tests
        shell: bash
        run: |
          set -o pipefail
          vgpu run ctest --test-dir build -L cuda-integration --output-on-failure --no-tests=error | tee integration.log
          grep -q "100% tests passed, 0 tests failed out of" integration.log
          if grep -qE "Not Run|\*\*\*Failed|CUDA error|SKIPPED|Skipped" integration.log; then
            echo "::error::an integration test failed or was skipped"
            exit 1
          fi
